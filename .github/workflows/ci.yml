name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build CLI
        run: |
          go mod tidy
          go build -o n8n-ops main.go
          chmod +x n8n-ops
          ./n8n-ops --help
        env:
          GOFLAGS: -buildvcs=false

  validate:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Get built binary
        run: |
          go build -o n8n-ops main.go
          chmod +x n8n-ops
      - name: Validate workflows
        run: ./n8n-ops validate ./workflows/ --verbose
        env:
          GOFLAGS: -buildvcs=false

  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Run Go vet
        run: go vet ./...
      - name: Run unit tests
        run: go test ./...
        env:
          GOFLAGS: -buildvcs=false
