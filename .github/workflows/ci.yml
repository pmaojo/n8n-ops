name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build CLI
        run: |
          go mod tidy
          go build -o n8n-ops main.go
          chmod +x n8n-ops
          ./n8n-ops --help
        env:
          GOFLAGS: -buildvcs=false

  validate:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Get built binary
        run: |
          go build -o n8n-ops main.go
          chmod +x n8n-ops
      - name: Validate workflows
        run: ./n8n-ops validate ./workflows/ --verbose
        env:
          GOFLAGS: -buildvcs=false

  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Run Go vet
        run: go vet ./...
      - name: Run unit tests with coverage
        run: go test ./... -coverprofile=coverage.out
        env:
          GOFLAGS: -buildvcs=false
      - name: Calculate coverage
        id: coverage
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%","",$3); print $3}')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          if [ "$total" != "100.0" ]; then
            echo "Coverage $total% is below 100%" >&2
            exit 1
          fi
        env:
          GOFLAGS: -buildvcs=false
      - name: Generate coverage badge
        run: |
          value=$(printf '%s' "${{ steps.coverage.outputs.total }}" | cut -d'.' -f1)
          curl -L "https://img.shields.io/badge/coverage-${value}%25-brightgreen" -o coverage.svg
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage.svg
