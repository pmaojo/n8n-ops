# GitLab CI/CD Configuration for n8n-ops Workflow Management
# This pipeline compiles the CLI tool and manages workflow deployments across environments

stages:
  - build
  - validate
  - test
  - deploy-dev
  - deploy-staging
  - deploy-production

variables:
  GO_VERSION: "1.19"
  CLI_BINARY: "n8n-ops"

# Common deployment template
.deploy_template:
  image: golang:${GO_VERSION}
  dependencies:
    - build-cli
  variables:
    TARGET_ENV: $CI_ENVIRONMENT_NAME
  script:
    - echo "Syncing workflows from $TARGET_ENV n8n instance..."
    - ./${CLI_BINARY} sync --env $TARGET_ENV --verbose
    - echo "Validating workflows before deployment..."
    - ./${CLI_BINARY} validate ./workflows/$TARGET_ENV/
    - echo "Running dry-run deployment..."
    - ./${CLI_BINARY} deploy --env $TARGET_ENV --dry-run --verbose
    - echo "Deploying workflows to $TARGET_ENV..."
    - ./${CLI_BINARY} deploy --env $TARGET_ENV --verbose
    - echo "$TARGET_ENV deployment completed"
  environment:
    url: $N8N_URL

# Build the CLI tool
build-cli:
  stage: build
  image: golang:${GO_VERSION}
  script:
    - echo "Building n8n-ops tool..."
    - go mod tidy
    - go build -o ${CLI_BINARY} main.go
    - chmod +x ${CLI_BINARY}
    - ./${CLI_BINARY} --help
  artifacts:
    paths:
      - ${CLI_BINARY}
    expire_in: 1 hour
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# Validate all workflow files
validate-workflows:
  stage: validate
  image: golang:${GO_VERSION}
  dependencies:
    - build-cli
  script:
    - echo "Validating workflow JSON files..."
    - ./${CLI_BINARY} validate ./workflows/ --verbose
    - echo "Validation completed successfully"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# Test CLI functionality
test-cli-functions:
  stage: test
  image: golang:${GO_VERSION}
  dependencies:
    - build-cli
  script:
    - echo "Testing CLI basic functions..."
    - ./${CLI_BINARY} welcome
    - ./${CLI_BINARY} --lang es welcome
    - ./${CLI_BINARY} version
    - echo "CLI tests completed"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# Deploy to Development Environment
deploy-development:
  extends: .deploy_template
  stage: deploy-dev
  variables:
    N8N_API_KEY: ${N8N_DEV_API_KEY}
    N8N_URL: ${N8N_DEV_URL}
  environment:
    name: development
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

# Deploy to Staging Environment (Manual)
deploy-staging:
  extends: .deploy_template
  stage: deploy-staging
  variables:
    N8N_API_KEY: ${N8N_STAGING_API_KEY}
    N8N_URL: ${N8N_STAGING_URL}
  environment:
    name: staging
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "staging"'

# Deploy to Production Environment (Manual + Protected)
deploy-production:
  extends: .deploy_template
  stage: deploy-production
  variables:
    N8N_API_KEY: ${N8N_PROD_API_KEY}
    N8N_URL: ${N8N_PROD_URL}
  environment:
    name: production
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Rollback Production (Emergency use only)
rollback-production:
  extends: .deploy_template
  stage: deploy-production
  variables:
    N8N_API_KEY: ${N8N_PROD_API_KEY}
    N8N_URL: ${N8N_PROD_URL}
  environment:
    name: production
  when: manual
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Notification job (runs after deployments)
notify-deployment:
  stage: deploy-production
  image: alpine:latest
  dependencies:
    - build-cli
  script:
    - echo "Sending deployment notification..."
    - echo "Deployment completed for environment: $CI_ENVIRONMENT_NAME"
    - echo "Branch: $CI_COMMIT_BRANCH"
    - echo "Commit: $CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "staging"'  
    - if: '$CI_COMMIT_BRANCH == "main"'
  when: on_success