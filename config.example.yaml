# n8n CLI Configuration Example
# Copy this file to ~/.n8n-ops.yaml and customize for your environment

# Default environment when no --env flag is specified
default_environment: development

# Environment configurations for different n8n instances
environments:
  development:
    # n8n instance URL
    url: "https://n8n-dev.yourcompany.com"
    
    # API key (use environment variable for security)
    api_key: "${N8N_API_KEY_DEV}"
    
    # Request timeout in seconds
    timeout: 30
    
    # Workflow directory for this environment
    workflow_dir: "./workflows/development"
    
    # Enable/disable SSL verification
    verify_ssl: true
    
  staging:
    url: "https://n8n-staging.yourcompany.com"
    api_key: "${N8N_API_KEY_STAGING}"
    timeout: 30
    workflow_dir: "./workflows/staging"
    verify_ssl: true
    
  production:
    url: "https://n8n-prod.yourcompany.com"
    api_key: "${N8N_API_KEY_PROD}"
    timeout: 60
    workflow_dir: "./workflows/production"
    verify_ssl: true
    
    # Additional validation for production
    require_confirmation: true
    backup_before_deploy: true

# Git branch to environment mapping
# This allows automatic environment detection based on current git branch
branch_mapping:
  main: production
  master: production
  staging: staging
  develop: development
  development: development
  "feature/*": development
  "hotfix/*": production
  "release/*": staging

# Local database settings for tracking deployments
database:
  # SQLite database path (relative to project root)
  path: ".n8n-ops/database.sqlite"
  
  # Enable backup before major operations
  backup_enabled: true
  
  # Keep deployment history for X days
  retention_days: 90

# Logging configuration
logging:
  # Log level: debug, info, warn, error
  level: "info"
  
  # Log file path
  file: ".n8n-ops/logs/n8n-ops.log"
  
  # Maximum log file size in MB
  max_size: 10
  
  # Number of old log files to keep
  max_backups: 5
  
  # Enable JSON formatted logs
  json_format: false

# Validation settings
validation:
  # Workflow file extensions to validate
  file_extensions:
    - ".json"
  
  # Required workflow properties
  required_fields:
    - "name"
    - "nodes"
    - "connections"
    - "active"
  
  # Maximum workflow file size in MB
  max_file_size: 5

# Deployment settings
deployment:
  # Create backup before deployment
  backup_before_deploy: true
  
  # Maximum number of concurrent deployments
  max_concurrent: 3
  
  # Retry failed deployments
  retry_count: 2
  
  # Wait time between retries in seconds
  retry_delay: 5

# CLI behavior settings
cli:
  # Default language (en, es)
  language: "en"
  
  # Show ASCII art and animations
  show_ascii_art: true
  
  # Color output (auto, always, never)
  color: "auto"
  
  # Progress bars and animations
  show_progress: true

# Terminal dashboard (tui) settings
tui:
  # Theme for the dashboard: default or cyberpunk
  theme: default

# GitLab integration settings
gitlab:
  # Base URL for GitLab API
  url: "https://gitlab.com"
  
  # Project ID (can be found in project settings)
  project_id: "${GITLAB_PROJECT_ID}"
  
  # Access token with API permissions
  token: "${GITLAB_TOKEN}"
  
  # Default merge request settings
  merge_request:
    default_target_branch: "staging"
    delete_source_branch: true
    squash: true

# Notification settings (optional)
notifications:
  # Slack webhook for deployment notifications
  slack:
    enabled: false
    webhook_url: "${SLACK_WEBHOOK_URL}"
    
  # Email notifications
  email:
    enabled: false
    smtp_host: "smtp.yourcompany.com"
    smtp_port: 587
    username: "${EMAIL_USERNAME}"
    password: "${EMAIL_PASSWORD}"
    from: "n8n-ops@yourcompany.com"
    to:
      - "team@yourcompany.com"

# Workflow template settings
templates:
  # Directory containing workflow templates
  directory: "./config/templates"
  
  # Available templates
  available:
    - "basic-webhook"
    - "data-processing"
    - "api-integration"
    - "scheduled-task"
    - "error-handling"

# Custom hooks (optional scripts to run)
hooks:
  # Run before any deployment
  pre_deploy: "./scripts/pre-deploy.sh"
  
  # Run after successful deployment
  post_deploy: "./scripts/post-deploy.sh"
  
  # Run before sync operation
  pre_sync: "./scripts/pre-sync.sh"
  
  # Run after sync operation  
  post_sync: "./scripts/post-sync.sh"